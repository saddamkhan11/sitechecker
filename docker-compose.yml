# One small Linux server: web + Celery worker + Redis + PostgreSQL + Nginx (HTTPS).
# 1) cp .env.example .env and fill it (DJANGO_DEBUG=false, POSTGRES_*, REDIS_URL=redis://redis:6379/0)
# 2) put your domain in deploy/nginx.conf and get a certificate (see README)
# 3) docker compose up -d --build && docker compose exec web python manage.py migrate && docker compose exec web python manage.py seed_v1
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on: [db, redis]
    volumes: [media:/app/media, static:/app/staticfiles]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: celery -A config worker -l info --concurrency 2
    depends_on: [db, redis]
    volumes: [media:/app/media]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [web]

volumes:
  pgdata:
  media:
  static:
