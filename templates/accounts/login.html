{% extends "base.html" %}{% load cc %}
{% block title %}Login{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{% tr "Login" %}</h1>
<form method="post" class="card p-3">{% csrf_token %}
  {% include "accounts/_form.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-brand btn-lg w-100">{% tr "Login" %}</button>
</form>
<p class="mt-3 text-center">{% tr "No account yet?" %} <a href="{% url 'signup' %}">{% tr "New account" %}</a></p>
{% endblock %}
