{% load cc %}{% if form.non_field_errors %}<div class="alert alert-danger py-2">{{ form.non_field_errors|join:" " }}</div>{% endif %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{% tr field.label %}</label>
    {% if field.field.widget.input_type == "select" %}
      <select name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-select">
        {% for v, l in field.field.choices %}<option value="{{ v }}" {% if field.value == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select>
    {% else %}
      <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
             class="form-control form-control-lg" {% if field.field.widget.input_type != "password" %}value="{{ field.value|default_if_none:'' }}"{% endif %}
             {% for k, v in field.field.widget.attrs.items %}{{ k }}="{{ v }}" {% endfor %}
             {% if field.field.required %}required{% endif %}>
    {% endif %}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
